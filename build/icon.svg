<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Revio</title>
  <!-- Revio app icon: a lens reviewing a diff. Content sits on the macOS icon grid (824px squircle, 100px margin). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a52"/>
      <stop offset="1" stop-color="#0d1020"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa6ff"/>
      <stop offset="1" stop-color="#6a5cff"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </radialGradient>
    <clipPath id="lens"><circle cx="560" cy="452" r="168"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- diff lines -->
  <g id="lines">
    <rect x="212" y="300" width="300" height="40" rx="20" fill="#5b6488"/>
    <rect x="212" y="372" width="420" height="40" rx="20" fill="#f0525a"/>
    <rect x="212" y="444" width="460" height="40" rx="20" fill="#3fc56b"/>
    <rect x="212" y="516" width="360" height="40" rx="20" fill="#3fc56b"/>
    <rect x="212" y="588" width="250" height="40" rx="20" fill="#5b6488"/>
  </g>

  <!-- the lens magnifies what is under it -->
  <g clip-path="url(#lens)">
    <rect x="380" y="270" width="380" height="370" fill="#141936"/>
    <g transform="translate(560 452) scale(1.32) translate(-560 -452)">
      <rect x="212" y="300" width="300" height="40" rx="20" fill="#7a84ad"/>
      <rect x="212" y="372" width="420" height="40" rx="20" fill="#ff6870"/>
      <rect x="212" y="444" width="460" height="40" rx="20" fill="#55e083"/>
      <rect x="212" y="516" width="360" height="40" rx="20" fill="#55e083"/>
      <rect x="212" y="588" width="250" height="40" rx="20" fill="#7a84ad"/>
    </g>
    <circle cx="560" cy="452" r="168" fill="url(#glass)"/>
  </g>

  <g filter="url(#shadow)">
    <line x1="708" y1="600" x2="800" y2="692" stroke="url(#ring)" stroke-width="78" stroke-linecap="round"/>
    <circle cx="560" cy="452" r="190" fill="none" stroke="url(#ring)" stroke-width="46"/>
  </g>
</svg>
