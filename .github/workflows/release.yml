# Builds an installable Revio for macOS on every push to main and publishes it as a GitHub release.
# The version is the package.json major.minor plus the run number (e.g. 0.1.42), so every build is newer than the
# last; the app's "Check for updates" compares against the latest release.
#
# Signing and notarization use these repository secrets; without all of them the build is ad-hoc signed, which macOS
# blocks on first launch:
#   MAC_CERT_P12_BASE64  a "Developer ID Application" certificate with its private key, as a base64-encoded .p12
#   MAC_CERT_PASSWORD    the .p12's export password
#   APPLE_API_KEY_P8     an App Store Connect API key (.p8 contents, Developer role), used to notarize
#   APPLE_API_KEY_ID     that key's ID
#   APPLE_API_ISSUER     the Issuer ID shown above the key list in App Store Connect
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Set the version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          version="$base.${{ github.run_number }}"
          npm version "$version" --no-git-tag-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${previous:+$previous..}HEAD
          git log --no-merges --format='- %s' "$range" | head -50 > release-notes.md

      - run: npm run build

      # Signs and notarizes when the secrets listed at the top are set; otherwise falls back to an ad-hoc build.
      - name: Package
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ] && [ ${#missing[@]} -lt 5 ]; then
            echo "::error::Some signing secrets are missing (${missing[*]}; CSC_LINK is MAC_CERT_P12_BASE64 and CSC_KEY_PASSWORD is MAC_CERT_PASSWORD). Add them or remove all of them."
            exit 1
          fi
          if [ ${#missing[@]} -eq 0 ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
            npx electron-builder --mac --arm64 --publish never
            app=dist/mac-arm64/Revio.app
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          else
            echo "::warning::Signing secrets are not set; building an ad-hoc signed app that macOS will block on first launch."
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --arm64 --publish never -c.mac.identity=-
          fi

      # One release with every file, created in a single call. electron-builder's own publishing uploads the dmg and
      # zip in parallel, and each upload tried to create the release, so all but the first failed.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml)
          gh release create "v${{ steps.version.outputs.version }}" "${files[@]}" \
            --target "$GITHUB_SHA" --title "${{ steps.version.outputs.version }}" --notes-file release-notes.md
