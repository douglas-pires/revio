# Builds an installable Revio for macOS.
#
# - Every push to main publishes a pre-release of the next patch, e.g. 0.2.4-dev.43: something to install and try. GitHub never marks a
#   pre-release as the latest release, so the app's "Check for updates" does not offer it to anyone.
# - A release happens only when you ask for one: run this workflow by hand (Actions → Release → Run workflow, or
#   `gh workflow run release.yml`), or push a tag like v0.2.4. It publishes a normal release with every change since
#   the last one, and the app offers it as an update.
#
# Versions follow the highest release tag: running the workflow raises it by the patch, minor or major you pick, unless
# you type a version or push a tag. package.json's version is a placeholder that this sets for the build, so nothing
# needs raising after a release. See docs/releasing.md.
#
# Signing and notarization use these repository secrets; without all of them the build is ad-hoc signed, which macOS
# blocks on first launch:
#   MAC_CERT_P12_BASE64  a "Developer ID Application" certificate with its private key, as a base64-encoded .p12
#   MAC_CERT_PASSWORD    the .p12's export password
#   APPLE_API_KEY_P8     an App Store Connect API key (.p8 contents, Developer role), used to notarize
#   APPLE_API_KEY_ID     that key's ID
#   APPLE_API_ISSUER     the Issuer ID shown above the key list in App Store Connect
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: What to raise from the last release
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: An exact version instead, e.g. 0.3.0
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm knip

      - run: pnpm typecheck

      - run: pnpm test

      # A tag push or a manual run is a release; a push to main is a pre-release of the next version.
      - name: Set the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          BUMP: ${{ inputs.bump || 'patch' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          IFS=. read -r major minor patch <<< "${last#v}"
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$((major)).$((minor + 1)).0" ;;
            *) next="$((major)).$((minor)).$((patch + 1))" ;;
          esac
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            kind=release
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${REQUESTED#v}"
            version="${version:-$next}"
            kind=release
          else
            version="$next-dev.${{ github.run_number }}"
            kind=prerelease
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$'; then
            echo "::error::'$version' is not a version like 0.2.0"
            exit 1
          fi
          if [ "$kind" = release ] && gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already released. Give a newer version."
            exit 1
          fi
          pnpm pkg set version="$version"
          {
            echo "version=$version"
            echo "kind=$kind"
            # macOS wants plain numbers in the app's version; the build number keeps every build distinct.
            echo "short=${version%%-*}"
          } >> "$GITHUB_OUTPUT"

      # Everything since the last release (pre-releases do not count), so a release lists every change it brings.
      - name: Release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-dev.*' HEAD^ 2>/dev/null || true)
          range=${previous:+$previous..}HEAD
          git log --no-merges --format='- %s' "$range" | head -100 > release-notes.md

      - run: pnpm build

      # Signs and notarizes when the secrets listed at the top are set; otherwise falls back to an ad-hoc build.
      - name: Package
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION_FLAGS: -c.mac.bundleShortVersion=${{ steps.version.outputs.short }} -c.buildVersion=${{ github.run_number }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ] && [ ${#missing[@]} -lt 5 ]; then
            echo "::error::Some signing secrets are missing (${missing[*]}; CSC_LINK is MAC_CERT_P12_BASE64 and CSC_KEY_PASSWORD is MAC_CERT_PASSWORD). Add them or remove all of them."
            exit 1
          fi
          if [ ${#missing[@]} -eq 0 ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
            pnpm exec electron-builder --mac --arm64 --publish never $VERSION_FLAGS
            app=dist/mac-arm64/Revio.app
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          else
            echo "::warning::Signing secrets are not set; building an ad-hoc signed app that macOS will block on first launch."
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac --arm64 --publish never -c.mac.identity=- $VERSION_FLAGS
          fi

      # One release with every file, created in a single call. electron-builder's own publishing uploads the dmg and
      # zip in parallel, and each upload tried to create the release, so all but the first failed.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          KIND: ${{ steps.version.outputs.kind }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml)
          flags=(--latest)
          if [ "$KIND" = prerelease ]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "v$VERSION" "${files[@]}" "${flags[@]}" \
            --target "$GITHUB_SHA" --title "$VERSION" --notes-file release-notes.md

      # Pre-releases pile up with every merge; keep the newest ten.
      - name: Prune old pre-releases
        if: steps.version.outputs.kind == 'prerelease'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\.")))] | .[10:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
